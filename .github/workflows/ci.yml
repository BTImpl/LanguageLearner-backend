name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer run on the same branch or PR cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: tool/format.sh check

      - name: Build and test
        run: mvn -B verify

  # Code gets into main only from a feature branch. Together with the branch
  # protection (see the README) this makes the rule binding.
  feature-branch-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the name of the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            feature/*) echo "OK: $HEAD_REF" ;;
            *)
              echo "::error::Only feature/* branches can be merged into main (this one is '$HEAD_REF')."
              exit 1
              ;;
          esac
