# Defaults for local runs. Everything that differs per environment comes from
# environment variables; no secret belongs in this file.
spring:
  application:
    name: languagelearner-backend
  datasource:
    # The local database of docker-compose.yml; see the README.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/languagelearner}
    username: ${DATABASE_USERNAME:languagelearner}
    password: ${DATABASE_PASSWORD:}

server:
  # Cloud Run tells the port in PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  sheets:
    # Id of the teacher's spreadsheet: the part of its URL between /d/ and /edit.
    spreadsheet-id: ${SHEETS_SPREADSHEET_ID:}
    # Name of the tab that lists the students (email | name | tab).
    students-tab: ${SHEETS_STUDENTS_TAB:Students}
  cache:
    # How long the student list (the Students tab) is kept before the sheet is read again.
    students-ttl: 5m
    # How long the decks of a student are kept.
    decks-ttl: 15m
    # A student can force a re-read (POST /api/v1/decks/refresh) at most this often.
    refresh-interval: 10s
  auth:
    # The web OAuth client id; a sign-in token is only accepted when issued for it.
    google-client-id: ${AUTH_GOOGLE_CLIENT_ID:}
    # Where Google publishes the keys its ID tokens are signed with.
    google-jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
