# Defaults for local runs. Everything that differs per environment comes from
# environment variables; no secret belongs in this file.
spring:
  application:
    name: languagelearner-backend
  datasource:
    # The local database of docker-compose.yml; see the README.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/languagelearner}
    username: ${DATABASE_USERNAME:languagelearner}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # A few connections are plenty, and none is kept open while idle, so the
      # free Neon database can suspend itself between rounds of practice.
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 0
      idle-timeout: 60000
  servlet:
    multipart:
      # The photo of a worksheet (POST /api/v1/quizzes/from-image) is at most 8 MB, the same as
      # QuizController.MAX_IMAGE_BYTES. It is held in memory (the threshold is above the request
      # limit) and never written to disk.
      max-file-size: 8MB
      max-request-size: 9MB
      file-size-threshold: 9MB

server:
  # Cloud Run tells the port in PORT.
  port: ${PORT:8080}
  # Finish the requests in flight when Cloud Run stops an instance.
  shutdown: graceful
  tomcat:
    # A photo over the limit is refused with 413 while it is received; the rest of it is read and
    # dropped (up to this size), so the client sees the answer and not a broken connection.
    max-swallow-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Adds /actuator/health/liveness and /readiness. They do not look at the
      # database, so the scheduled ping that keeps the service warm does not
      # keep the database awake too.
      probes:
        enabled: true

app:
  sheets:
    # Id of the teacher's spreadsheet: the part of its URL between /d/ and /edit.
    spreadsheet-id: ${SHEETS_SPREADSHEET_ID:}
    # Name of the tab that lists the students (email | name | tab).
    students-tab: ${SHEETS_STUDENTS_TAB:Students}
  cache:
    # How long the student list (the Students tab) is kept before the sheet is read again.
    students-ttl: 5m
    # How long the decks of a student are kept.
    decks-ttl: 15m
    # A student can force a re-read (POST /api/v1/decks/refresh) at most this often.
    refresh-interval: 10s
  auth:
    # The OAuth client ids of the app (web and iOS), separated by ';'; a sign-in token is only
    # accepted when issued for one of them. A native iOS sign-in issues the token for the iOS client.
    google-client-id: ${AUTH_GOOGLE_CLIENT_ID:}
    # Where Google publishes the keys its ID tokens are signed with.
    google-jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  quiz:
    gemini:
      # The key of the Gemini API that reads the photos of worksheets. Only from the environment.
      api-key: ${GEMINI_API_KEY:}
      # Pinned on purpose: an alias such as gemini-flash-lite-latest would change the model, and so
      # the behaviour, without a deploy. This is the model the BE-12 experiment was run with.
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      base-url: https://generativelanguage.googleapis.com/v1beta
      # The longest a request may take; an answer needs about 10-20 seconds.
      timeout: ${GEMINI_TIMEOUT:60s}
    limit:
      # How many quizzes from photos a student may have made per day (UTC). Every one is a paid
      # model call. The count is kept in memory, so it starts again when the instance restarts.
      per-day: ${QUIZ_DAILY_LIMIT:20}
