# The database for local runs: `docker compose up -d`, then start the app.
# It accepts any connection without a password, and is reachable from this
# computer only, so no secret is needed. Never use this setup anywhere else.
services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: languagelearner
      POSTGRES_USER: languagelearner
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U languagelearner -d languagelearner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
